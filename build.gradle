plugins {
    id 'java'
    id "io.freefair.lombok" version "9.2.0"
    id "run.halo.plugin.devtools" version "0.6.2"
}

group 'com.avrinbai'

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('run.halo.tools.platform:plugin:2.23.0')
    compileOnly 'run.halo.app:api'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.google.zxing:javase:3.5.3'

    testImplementation 'run.halo.app:api'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
    options.compilerArgs.add('-parameters')
}

tasks.named('compileJava') {
    finalizedBy(tasks.named('generatePluginComponentsIdx'))
}

tasks.register('processUiResources', Copy) {
    group = 'build'
    description = 'Builds :ui and copies dist into plugin resources (console)'
    from project(':ui').layout.buildDirectory.dir('dist')
    into layout.buildDirectory.dir('resources/main/console')
    dependsOn(project(':ui').tasks.named('assemble'))
    dependsOn(tasks.named('processResources'))
}

tasks.named('processResources') {
    finalizedBy(tasks.named('processUiResources'))
}

tasks.named('compileTestJava') {
    dependsOn(tasks.named('processUiResources'))
}

tasks.named('jar') {
    dependsOn(tasks.named('processUiResources'))
    dependsOn(tasks.named('generatePluginComponentsIdx'))
    manifest {
        attributes('Plugin-Main-Class': 'com.avrinbai.wechatshare.WechatSharePlugin')
    }
}

tasks.named('generatePluginComponentsIdx') {
    notCompatibleWithConfigurationCache('This task invokes "Task.project" at execution time, which is not supported with configuration cache.')
}

halo {
    version = '2.23'
}
