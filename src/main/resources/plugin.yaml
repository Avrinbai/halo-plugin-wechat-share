apiVersion: plugin.halo.run/v1alpha1
kind: Plugin
metadata:
  name: wechat-share
spec:
  enabled: true
  requires: ">=2.23.0"
  author:
    name: bai
    website: https://avrinbai.cn
  logo: logo.png
  homepage: https://github.com/Avrinbai/halo-plugin-wechat-share#readme
